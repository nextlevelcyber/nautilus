<!doctype html>
<!--
  PROTOTYPE — throwaway. 回测控制台页面草图，纯前端假数据，无持久化。
  只保留控制台式方案：侧边导航 + 任务队列（每行一条回放轨迹）+ 多次运行对比 + 数据 / 策略 / 模拟交易所目录。
  表单字段映射到 nautilus 的 BacktestRunConfig / BacktestDataConfig /
  BacktestVenueConfig / ImportableStrategyConfig。
  运行：直接双击打开，或 python3 -m http.server -d .scratch/prototype-backtest-console
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回测台 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ECEFF1; --sheet: #F8F9FA; --hover: #F0F3F5;
    --ink: #18212E; --ink-2: #4A5566; --ink-3: #8A94A3;
    --rule: #CBD2D9; --rule-2: #DFE4E9;
    --rail: #1C2533; --rail-ink: #AEB8C6;
    --signal: #D4900F; --signal-ink: #8A5B00; --signal-wash: #F6E7C8;
    --gain: #0F7A55; --gain-wash: #DDEFE6; --loss: #B8322A; --loss-wash: #F6E0DE;
    --info: #2E5C8A; --info-wash: #E1E9F2;
    --r-s: 4px; --r-m: 8px;
    --font: "Archivo", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.55 var(--font); }
  h1, h2, h3, p, dl, dd, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  code { font: 12px/1.5 var(--mono); }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- 外壳 ---------- */
  .shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100vh; }
  .rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
    padding: 20px 12px; background: var(--rail); color: var(--rail-ink); }
  .brand { display: flex; white-space: nowrap; align-items: center; gap: 10px; margin: 2px 8px 28px; color: #fff; font-size: 16px; font-weight: 700; letter-spacing: .04em; }
  .brand-mark { flex: none; width: 30px; height: 20px; }
  .nav-group + .nav-group { margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, .09); }
  .nav-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
    padding: 8px 10px; border: 0; border-radius: var(--r-s); background: none; color: inherit; text-align: left; cursor: pointer; }
  .nav-link:hover { background: rgba(255, 255, 255, .05); color: #fff; }
  .nav-link[aria-current="page"] { background: rgba(255, 255, 255, .08); color: #fff; box-shadow: inset 2px 0 0 var(--signal); }
  .nav-count { min-width: 22px; padding: 0 6px; border-radius: 10px; background: rgba(212, 144, 15, .2); color: #F2C46B;
    font-size: 12px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
  .rail-note { margin-top: auto; padding: 0 8px; color: #7F8A9B; font-size: 12px; line-height: 1.6; }

  .main { min-width: 0; }
  .top { display: flex; align-items: flex-end; gap: 28px; padding: 28px 36px 20px; border-bottom: 1px solid var(--rule); }
  .top-title { flex: 1; min-width: 0; }
  .top-title h1 { font-size: 24px; line-height: 1.25; font-weight: 700; letter-spacing: .02em; }
  .top-title p { max-width: 62ch; margin-top: 6px; color: var(--ink-2); }
  .cap { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
  .cap-cells { display: grid; grid-template-columns: repeat(8, 8px); gap: 3px; }
  .cap-cells i { height: 20px; border: 1px solid var(--rule); border-radius: 2px; background: var(--rule-2); }
  .cap-cells i.on { border-color: var(--signal); background: var(--signal); }
  .cap b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .view { padding: 24px 36px 120px; }

  /* ---------- 控件 ---------- */
  .btn { padding: 8px 16px; border: 1px solid var(--rule); border-radius: var(--r-s); background: var(--sheet);
    font-weight: 600; line-height: 1.3; white-space: nowrap; cursor: pointer; }
  .btn:hover { border-color: var(--ink-3); }
  .btn-primary { border-color: var(--ink); background: var(--ink); color: #fff; }
  .btn-primary:hover { border-color: #2A3547; background: #2A3547; }
  .btn-s { padding: 5px 10px; font-size: 13px; }
  .btn-block { display: block; width: 100%; padding: 12px; font-size: 15px; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .link-btn { padding: 0; border: 0; background: none; color: var(--info); font-size: 13px; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; }
  .icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 1px solid transparent;
    border-radius: var(--r-s); background: none; color: var(--ink-2); cursor: pointer; }
  .icon-btn:hover { border-color: var(--rule); color: var(--ink); }
  .icon-btn svg { transition: transform .18s ease; }
  .icon-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  input[type="number"], input[type="date"] { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--r-s);
    background: #fff; font-variant-numeric: tabular-nums; }
  input[type="number"]:hover, input[type="date"]:hover { border-color: var(--ink-3); }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--ink); width: 15px; height: 15px; }

  /* ---------- 通用文本 ---------- */
  .sub { margin-top: 2px; color: var(--ink-2); font-size: 12px; }
  .sub .by { margin-left: 8px; }
  .muted { color: var(--ink-2); font-size: 13px; }
  .ver { color: var(--ink-2); font-size: 12px; font-weight: 500; }
  .strat { font-weight: 600; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gain { color: var(--gain); } .loss { color: var(--loss); } .nil { color: var(--ink-3); }
  .grain { display: inline-block; margin: 0 4px 2px 0; padding: 1px 6px; border-radius: 3px; background: var(--info-wash); color: var(--info);
    font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
  .params { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; color: var(--ink-2); font-size: 12px; }
  .kv b { margin-left: 4px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 3px; font-size: 11.5px; font-weight: 600; }
  .pill.warn { background: var(--signal-wash); color: var(--signal-ink); }
  .cal { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .cal::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
  .cal-ok::before { background: var(--gain); } .cal-warn::before { background: var(--signal); } .cal-err::before { background: var(--loss); }

  /* ---------- 表格 ---------- */
  .table-wrap { position: relative; overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-m); background: var(--sheet); }
  table { width: 100%; min-width: 980px; border-collapse: collapse; }
  th { padding: 10px 12px; border-bottom: 1px solid var(--rule); color: var(--ink-2); font-size: 12px; font-weight: 600;
    text-align: left; white-space: nowrap; }
  th.num { text-align: right; }
  td { padding: 12px; border-bottom: 1px solid var(--rule-2); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  .c-cmp { width: 40px; padding-right: 0; }
  .c-cmp input { margin-top: 3px; }
  .c-open { width: 48px; padding: 8px 10px 8px 0; text-align: right; }

  /* ---------- 任务队列 ---------- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-bottom: 14px; }
  .seg { display: inline-flex; max-width: 100%; overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r-s); background: var(--sheet); }
  .seg button { flex: none; white-space: nowrap; padding: 6px 13px; border: 0; border-right: 1px solid var(--rule); background: none; color: var(--ink-2); font-size: 13px; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .seg .n { margin-left: 6px; opacity: .7; font-variant-numeric: tabular-nums; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; cursor: pointer; }

  tr.job { cursor: pointer; }
  tr.job:hover td { background: var(--hover); }
  tr.job.is-open td { border-bottom-color: transparent; background: var(--hover); }
  tr.job.is-new td { animation: arrive 2.4s ease-out both; animation-delay: var(--d, 0ms); }
  @keyframes arrive { from { background: var(--signal-wash); } to { background: transparent; } }
  .job-id, tr.job .sub { white-space: nowrap; }
  .job-id { font-size: 15px; font-weight: 700; font-stretch: 115%; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
  .big { font-size: 16px; font-weight: 700; font-stretch: 112%; }

  .c-track { width: 250px; min-width: 230px; }
  .track { position: relative; height: 38px; overflow: hidden; border-radius: 3px; background: var(--paper); }
  .track svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .track path, .track line { fill: none; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .track .played { fill: rgba(24, 33, 46, .055); }
  .track .zero { stroke: var(--rule); stroke-dasharray: 3 3; }
  .track .cursor { stroke: var(--signal); stroke-width: 2; }
  .track .stop { stroke: var(--loss); stroke-width: 2; }
  .ln-ink { stroke: var(--ink); stroke-width: 1.5; }
  .ln-gain { stroke: var(--gain); stroke-width: 1.5; }
  .ln-loss { stroke: var(--loss); stroke-width: 1.5; }
  .ln-dim { stroke: var(--ink-3); stroke-width: 1.5; }
  .track.is-queue { background: repeating-linear-gradient(-45deg, var(--paper) 0 6px, var(--rule-2) 6px 7px); }
  .track-cap { display: flex; align-items: center; gap: 7px; margin-top: 6px; overflow: hidden; color: var(--ink-2);
    font-size: 12px; white-space: nowrap; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; }
  .dot.run { background: var(--signal); animation: pulse 1.6s ease-in-out infinite; }
  .dot.queue { border: 1.5px solid var(--ink-3); }
  .dot.done { background: var(--ink-2); }
  .dot.fail { background: var(--loss); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(212, 144, 15, .25); } }

  .drawer-row > td { padding: 0; border-bottom: 1px solid var(--rule); background: var(--hover); }
  .drawer { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(320px, 1.6fr) minmax(240px, 1fr); gap: 32px; padding: 6px 24px 24px 52px; }
  .drawer h3 { margin-bottom: 10px; font-size: 13px; font-weight: 700; }
  .kvlist { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
  .kvlist dt { color: var(--ink-2); }
  .kvlist dd { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .kvlist.wrap dd { font-weight: 500; text-align: left; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .error-note { margin-bottom: 10px; padding: 8px 10px; border-radius: var(--r-s); background: var(--loss-wash); color: var(--loss); font-size: 13px; }
  .chart-empty { display: grid; place-items: center; height: 168px; border: 1px dashed var(--rule); border-radius: var(--r-s); color: var(--ink-2); font-size: 13px; }

  /* ---------- 图表 ---------- */
  .chart { display: grid; grid-template-columns: 48px minmax(0, 1fr); grid-template-rows: var(--h) auto; column-gap: 8px; }
  .chart-y { position: relative; color: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart-y span { position: absolute; right: 0; transform: translateY(-50%); }
  .chart-plot { position: relative; border-bottom: 1px solid var(--rule); border-left: 1px solid var(--rule); cursor: crosshair; }
  .chart-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .chart-plot path, .chart-plot line { fill: none; vector-effect: non-scaling-stroke; }
  .chart-plot path { stroke-width: 1.75; stroke-linejoin: round; }
  .chart-plot .grid { stroke: var(--rule-2); }
  .chart-plot .zero { stroke: var(--ink-3); stroke-dasharray: 4 4; }
  .chart-x { grid-column: 2; display: flex; justify-content: space-between; padding-top: 6px; color: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart-hover { position: absolute; inset: 0; pointer-events: none; }
  .chart-line { position: absolute; top: 0; bottom: 0; left: var(--x); width: 1px; background: var(--ink); }
  .chart-tip { position: absolute; top: 6px; left: calc(var(--x) + 10px); z-index: 2; padding: 8px 10px; border-radius: var(--r-s);
    background: var(--ink); color: #fff; font-size: 12px; line-height: 1.7; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chart-tip.flip { left: auto; right: calc(100% - var(--x) + 10px); }
  .chart-tip .when { color: #AEB8C6; }
  .sw { display: inline-block; width: 14px; height: 3px; margin-right: 8px; border-radius: 2px; vertical-align: middle; }

  /* ---------- 结果对比 ---------- */
  .pane { padding: 20px 20px 16px; border: 1px solid var(--rule); border-radius: var(--r-m); background: var(--sheet); }
  .pane + .table-wrap, .pane + .pane { margin-top: 16px; }
  .pane-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 16px; }
  .pane-head h2 { font-size: 15px; font-weight: 700; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border: 1px solid var(--rule);
    border-radius: 999px; background: #fff; font-size: 13px; }
  .legend-item .sw { margin-right: 2px; }
  .legend-item b { font-stretch: 112%; }
  .legend-item .x { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ink-2); cursor: pointer; }
  .legend-item .x:hover { background: var(--paper); color: var(--ink); }
  table.cmp { min-width: 560px; }
  table.cmp th:first-child, table.cmp td:first-child { width: 200px; }
  table.cmp tr.grp th { padding: 14px 12px 6px; border-bottom: 1px solid var(--rule); background: var(--paper); color: var(--ink); font-size: 13px; font-weight: 700; }
  table.cmp td { padding: 9px 12px; }
  table.cmp td:first-child { color: var(--ink-2); }
  table.cmp tr.diff td { background: #FCF6E9; }
  table.cmp tr.diff td:first-child { box-shadow: inset 3px 0 0 var(--signal); color: var(--ink); }
  .diff-tag { margin-left: 8px; color: var(--signal-ink); font-size: 12px; font-weight: 600; }
  .best-v { font-weight: 700; text-decoration: underline 2px; text-underline-offset: 5px; }
  .note { max-width: 72ch; margin-top: 12px; color: var(--ink-2); font-size: 12px; }

  .empty { max-width: 520px; padding: 56px 0; }
  .empty h2 { font-size: 18px; font-weight: 700; }
  .empty p { margin: 8px 0 20px; color: var(--ink-2); }

  /* ---------- 数据目录 ---------- */
  .c-cov { width: 34%; min-width: 300px; }
  .cov-axis { position: relative; height: 16px; margin-top: 4px; }
  .cov-axis span { position: absolute; color: var(--ink-3); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .cov { position: relative; height: 16px; margin-top: 2px; }
  .cov .yl { position: absolute; top: -14px; bottom: -14px; width: 1px; background: var(--rule-2); }
  .cov-bar { position: absolute; top: 4px; height: 8px; min-width: 3px; border-radius: 2px; background: var(--info); }
  code.path { color: var(--ink-2); }

  /* ---------- 新建回测 ---------- */
  .compose { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; align-items: start; }
  .fs { margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--rule); }
  .fs:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }
  .fs-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin-bottom: 12px; }
  .fs-head h2 { font-size: 17px; font-weight: 700; }
  .fs-head p { color: var(--ink-2); font-size: 13px; }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: var(--r-s);
    background: var(--sheet); cursor: pointer; }
  .opt:hover { border-color: var(--ink-3); }
  .opt.on { border-color: var(--ink); background: #fff; box-shadow: inset 0 0 0 1px var(--ink); }
  .opt.is-off { background: transparent; }
  .opt.is-off .opt-title { color: var(--ink-2); }
  .opt input { flex: none; margin: 3px 0 0; }
  .opt-body { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
  .opt-title { font-weight: 600; }
  .opt-meta { color: var(--ink-2); font-size: 12px; }
  .opt-side { display: flex; flex: none; flex-direction: column; align-items: flex-end; gap: 4px; }
  .opt-note { color: var(--ink-2); font-size: 11.5px; white-space: nowrap; }
  .params-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 18px; margin-top: 20px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field-label { font-size: 13px; font-weight: 600; }
  .field-hint { color: var(--ink-2); font-size: 12px; }
  .field-hint code { font-size: 11.5px; }
  .dates { display: grid; grid-template-columns: 180px 180px minmax(0, 1fr); align-items: end; gap: 14px 18px; margin-top: 20px; }
  .cov-note { padding-bottom: 9px; color: var(--ink-2); font-size: 13px; }
  .cov-note .link-btn { margin-left: 6px; }

  .summary { position: sticky; top: 20px; padding: 20px; border: 1px solid var(--rule); border-radius: var(--r-m); background: var(--sheet); }
  .summary > h2 { margin-bottom: 14px; font-size: 15px; font-weight: 700; }
  .summary .kvlist { grid-template-columns: 76px 1fr; }
  .check-ok { display: flex; align-items: center; gap: 8px; margin-top: 18px; color: var(--gain); font-size: 13px; font-weight: 600; }
  .check { margin-top: 18px; }
  .check h3 { margin-bottom: 6px; font-size: 12.5px; font-weight: 700; }
  .check li { margin-bottom: 6px; padding: 2px 0 2px 10px; border-left: 2px solid; font-size: 13px; line-height: 1.5; }
  .check.err h3 { color: var(--loss); } .check.err li { border-color: var(--loss); }
  .check.warn h3 { color: var(--signal-ink); } .check.warn li { border-color: var(--signal); }
  .check.info h3 { color: var(--info); } .check.info li { border-color: var(--info); }
  .eta { display: flex; flex-direction: column; gap: 2px; margin: 20px 0 14px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--ink-2); font-size: 12.5px; }
  .eta b { color: var(--ink); font-size: 22px; font-weight: 700; font-stretch: 112%; line-height: 1.25; }
  .cfg-toggle { display: block; margin-top: 14px; }
  pre.code { max-height: 380px; margin: 12px 0 0; padding: 14px; overflow: auto; border-radius: 6px; background: var(--ink); color: #D5DEEA; font: 11.5px/1.55 var(--mono); }

  /* ---------- 浮层 ---------- */
  .tray { position: fixed; bottom: 20px; left: calc(50% + 104px); z-index: 20; display: flex; align-items: center; gap: 10px;
    max-width: calc(100vw - 32px); padding: 8px 10px 8px 16px; transform: translateX(-50%); border-radius: var(--r-m);
    background: var(--ink); color: #fff; font-size: 13px; box-shadow: 0 12px 32px rgba(24, 33, 46, .3); animation: rise .22s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 10px); } }
  .tray > * { flex: none; white-space: nowrap; }
  .tray .chip { padding: 1px 8px; border: 1px solid rgba(255, 255, 255, .22); border-radius: 999px; font-weight: 600; font-stretch: 112%; }
  .tray .hint { color: #AEB8C6; }
  .tray .btn { border-color: var(--signal); background: var(--signal); color: var(--ink); }
  .tray .link-btn { color: #C9D3E0; }
  .toast { position: fixed; top: 16px; left: calc(50% + 104px); z-index: 30; translate: -50% 0; width: max-content; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 6px; background: var(--ink); color: #fff;
    font-size: 13px; opacity: 0; transform: translateY(-8px); pointer-events: none; transition: opacity .2s, transform .2s; }
  .toast.show { opacity: 1; transform: none; }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 960px) {

const defaults = id => Object.fromEntries(byId(STRATEGIES, id).params.map(p => [p.key, p.def]));
const DAY = 864e5;
const T = s => Date.parse(s + 'T00:00:00Z');
const isoDay = t => new Date(t).toISOString().slice(0, 10);
const spanDays = (a, b) => Math.round((T(b) - T(a)) / DAY) + 1;
const shortDay = (t, a, b) => a.slice(0, 4) === b.slice(0, 4) ? isoDay(t).slice(5) : isoDay(t);

// ---------------------------------------------------------------------------
// 校验、配置映射、假指标
// ---------------------------------------------------------------------------
function coverage(ids) {
  const ds = ids.map(id => byId(DATASETS, id));
  if (!ds.length) return null;
  return { from: ds.map(d => d.from).sort().at(-1), to: ds.map(d => d.to).sort()[0] };
}

function validate(sel) {
  const out = [];
  const st = byId(STRATEGIES, sel.strategy);
  const ds = sel.datasets.map(id => byId(DATASETS, id));
  const vs = sel.venues.map(id => byId(VENUES, id));
  if (!st) out.push({ lvl: 'err', text: '请选择策略' });
  if (!ds.length) out.push({ lvl: 'err', text: '请至少选择一个数据集' });
  if (!vs.length) out.push({ lvl: 'err', text: '请至少选择一个模拟交易所' });
  if (st) st.params.forEach(p => {
    const v = sel.params[p.key];
    if (v === '' || v == null || !Number.isFinite(+v)) out.push({ lvl: 'err', text: `参数「${p.label}」需要填一个数字` });
  });
  if (!sel.start || !sel.end) out.push({ lvl: 'err', text: '请填写开始和结束日期' });
  else if (sel.start > sel.end) out.push({ lvl: 'err', text: '开始日期晚于结束日期' });
  const cov = coverage(sel.datasets);
  if (cov && sel.start && sel.end) {
    if (cov.from > cov.to) out.push({ lvl: 'err', text: '所选数据集没有共同覆盖的时间段' });
    else if (sel.start < cov.from || sel.end > cov.to) out.push({ lvl: 'err', text: `回测时间超出数据覆盖范围，所选数据共同覆盖 ${cov.from} 至 ${cov.to}` });
  }
  if (st && ds.length) {
    const grains = ds.map(d => d.grain);
    if (!grains.some(g => st.needs.includes(g)))
      out.push({ lvl: 'err', text: `「${st.name}」需要${st.needsText}，所选数据粒度不足，跑出来的结果没有参考价值` });
    if (st.alsoNeeds && !grains.some(g => st.alsoNeeds.includes(g)))
      out.push({ lvl: 'err', text: `「${st.name}」还需要交易所报价或订单簿数据` });
    const dataVenues = new Set(ds.filter(d => d.venue !== 'PYTH').map(d => d.venue));
    if (st.minVenues > 1 && (vs.length < st.minVenues || dataVenues.size < st.minVenues))
      out.push({ lvl: 'err', text: `「${st.name}」至少需要 ${st.minVenues} 个交易所的数据和模拟交易所` });
  }
  ds.forEach(d => {
    if (d.venue !== 'PYTH' && !sel.venues.includes(d.venue))
      out.push({ lvl: 'warn', text: `数据「${d.name}」属于 ${d.venue}，但没有选择对应的模拟交易所，这份数据只会作为行情输入` });
    if (d.grain === 'L3') vs.forEach(v => { if (v.id === d.venue && v.book !== 'L3_MBO') out.push({ lvl: 'warn', text: `${v.id} 模拟交易所订单簿类型为 ${v.book}，L3 数据会被降级使用` }); });
    if (d.ts.startsWith('仅本地')) out.push({ lvl: 'warn', text: `「${d.name}」缺少交易所时间，无法评估行情延迟` });
  });
  vs.forEach(v => {
    if (v.cal === 'err') out.push({ lvl: 'warn', text: `${v.name} 未用实盘成交校准，成交结果仅供参考` });
    if (v.cal === 'warn') out.push({ lvl: 'warn', text: `${v.name} 校准已过期：${v.calibrated}` });
  });
  if (ds.some(d => d.grain === 'Custom'))
    out.push({ lvl: 'info', text: '包含自定义数据（Pyth）：BacktestNode 不支持，将以低层 BacktestEngine 方式运行' });
  return out;
}
const canSubmit = sel => !validate(sel).some(m => m.lvl === 'err');

function buildConfig(sel) {
  const st = byId(STRATEGIES, sel.strategy);
  const run = {
    BacktestRunConfig: {
      id: 'run-' + hash(JSON.stringify(sel)).toString(16).slice(0, 8),
      venues: sel.venues.map(id => { const v = byId(VENUES, id); return {
        name: v.id, oms_type: v.oms, account_type: v.acct, book_type: v.book,
        starting_balances: [v.balance], queue_position: v.fill.includes('排队'),
        liquidity_consumption: v.fill.includes('流动性'),
        fee_model: { type: 'MakerTakerFeeModel', maker_rate: v.maker, taker_rate: v.taker },
        latency_model: v.latency, fill_model: v.fill }; }),
      data: sel.datasets.map(id => { const d = byId(DATASETS, id); return {
        data_type: d.dataType, catalog_path: 's3://quant-catalog/v3', instrument_id: d.instrument,
        start_time: sel.start, end_time: sel.end }; }),
      chunk_size: 100000,
    },
  };
  if (st) run.ImportableStrategyConfig = { strategy_path: st.path, config_path: st.cfgPath, config: { ...sel.params } };

}

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rnd(seed) { let x = seed || 1; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 10000) / 10000; }; }

function fakeMetrics(sel) {
  const r = rnd(hash(JSON.stringify(sel)));
  const st = byId(STRATEGIES, sel.strategy) || STRATEGIES[0];
  const sharpe = +(r() * 4 - 0.6).toFixed(2);
  const pnl = Math.round((sharpe * 180000 + (r() - 0.5) * 90000));
  const m = {
    '净盈亏 (USD)': pnl, '夏普 (365 日年化)': sharpe, '最大回撤': -(r() * 6 + 0.5).toFixed(2) + '%',
    '成交笔数': Math.round(r() * 90000 + 2000), '手续费 (USD)': -Math.round(r() * 60000 + 5000),
  };
  if (st.kind === 'mm') Object.assign(m, {
    '挂单成交率': (r() * 18 + 2).toFixed(1) + '%', '1 秒 markout (bps)': +(r() * 1.6 - 0.9).toFixed(2),
    '平均库存 (BTC)': (r() * 0.8).toFixed(2), '报价在线率': (r() * 8 + 91).toFixed(1) + '%' });
  if (st.kind === 'arb') Object.assign(m, {
    '价差捕获率': (r() * 40 + 35).toFixed(1) + '%', '单腿成交风险次数': Math.round(r() * 40), '平均持仓时长 (秒)': (r() * 50 + 3).toFixed(1) });
  if (st.kind === 'dir') Object.assign(m, { '胜率': (r() * 20 + 42).toFixed(1) + '%', '平均持仓 (分钟)': Math.round(r() * 200 + 10) });
  // 曲线终点对齐净盈亏，让图和表说同一件事
  const n = 120, raw = [0]; let eq = 0;
  for (let i = 1; i < n; i++) { eq += (r() - 0.5 + sharpe * 0.06) * 6000; raw.push(eq); }
  const drift = pnl - raw[n - 1];
  const curve = raw.map((v, i) => Math.round(v + drift * i / (n - 1)));
  return { m, curve, sharpe };
}

function estimateMin(sel) {
  const W = { L3: 1.2, L2: 0.6, L1: 0.15, Trades: 0.1, Bars: 0.003, Funding: 0.001, Custom: 0.05 };
  const d = sel.start && sel.end && sel.start <= sel.end ? spanDays(sel.start, sel.end) : 1;
  const base = sel.datasets.reduce((a, id) => a + d * (W[byId(DATASETS, id).grain] || 0.1), 0);
  return Math.max(2, Math.round(base * (1 + 0.15 * Math.max(0, sel.venues.length - 1))));
}

const DEFAULT_SEL = () => ({ strategy: 'mm', datasets: ['bnf-btc-l2'], venues: ['BINANCE'], params: defaults('mm'), start: '2026-09-01', end: '2026-09-30' });

// ---------------------------------------------------------------------------
// 任务队列与假 worker
// ---------------------------------------------------------------------------
let JOBS = [];
let jobSeq = 41;
const clock = minAgo => new Date(Date.now() - minAgo * 60e3).toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
const jobById = id => JOBS.find(j => j.id === id);
const countBy = status => JOBS.filter(j => j.status === status).length;

function submitJob(sel, minAgo = 0) {
  const st = byId(STRATEGIES, sel.strategy);
  const job = { id: 'BT-' + (++jobSeq), sel: structuredClone(sel), strategy: st.name, ver: st.version, user: '我',
    status: '排队中', progress: 0, etaMin: estimateMin(sel), submitted: clock(minAgo),
    code: hash(st.path + st.version).toString(16).slice(0, 7), dataVer: 'catalog@v3.' + (hash(sel.datasets.join()) % 40), _r: fakeMetrics(sel) };
  JOBS.unshift(job);
  return job;
}

// 预置几条任务，方便看队列和对比
(function seed() {
  const base = DEFAULT_SEL();
  const mk = patch => ({ ...base, ...patch, params: { ...base.params, ...(patch.params || {}) } });
  const arb = p => ({ strategy: 'arb', datasets: ['bnf-btc-l2', 'okx-btc-l2'], venues: ['BINANCE', 'OKX'], params: { ...defaults('arb'), ...p }, start: '2026-09-01', end: '2026-09-30' });
  [
    [mk({}), '张三', 'done', 0, 190],
    [mk({ params: { spread_bps: 3 } }), '李四', 'done', 0, 160],
    [arb({}), '王五', 'done', 0, 130],
    [mk({ params: { max_inventory: 2 } }), '我', 'done', 0, 95],
    [{ strategy: 'mom', datasets: ['bnf-btc-1m'], venues: ['BINANCE'], params: defaults('mom'), start: '2022-01-01', end: '2026-09-30' }, '王五', 'fail', 46, 70],
    [mk({ datasets: ['bybit-eth-l2'], venues: ['BYBIT'] }), '李四', 'run', 37, 25],
    [arb({ entry_bps: 4, max_notional_usd: 250000 }), '王五', 'run', 12, 12],
    [mk({ params: { spread_bps: 4, skew_factor: 0.6 } }), '我', 'run', 4, 3],
  ].forEach(([sel, user, state, p, ago]) => {
    const j = submitJob(sel, ago); j.user = user; j.progress = p;
    if (state === 'done') { j.status = '已完成'; j.progress = 100; j.result = j._r; }
    if (state === 'run') j.status = '运行中';
    if (state === 'fail') { j.status = '失败'; j.error = '数据缺口：2024-03-11 03:00 至 05:40 没有 K 线';
      j.progress = (T('2024-03-11') - T(sel.start)) / (T(sel.end) - T(sel.start)) * 100; }
  });
})();

// 同时最多 WORKERS 个任务运行，按提交顺序出队
setInterval(() => {
  let running = countBy('运行中');
  JOBS.slice().reverse().forEach(j => { if (j.status === '排队中' && running < WORKERS) { j.status = '运行中'; running++; } });
  JOBS.forEach(j => {
    if (j.status !== '运行中') return;
    j.progress = Math.min(100, j.progress + 1.2 + Math.random() * 2.4);
    if (j.progress >= 100) { j.status = '已完成'; j.result = j._r; }
  });
  tick();
}, 1000);

const CHEVRON = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const BRAND = `<svg class="brand-mark" viewBox="0 0 30 20" aria-hidden="true"><rect x=".75" y=".75" width="28.5" height="18.5" rx="3" fill="none" stroke="#AEB8C6" stroke-opacity=".45" stroke-width="1.5"/>
  <path d="M4 14.5L8 12l3 1.5 4.5-7 3.5 3" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

function fmtVal(v, k = '') {
  if (typeof v !== 'number') return esc(v);
  const s = v.toLocaleString('en-US');
  return /盈亏|夏普|markout/.test(k) ? `<span class="${v < 0 ? 'loss' : 'gain'}">${v > 0 ? '+' : ''}${s}</span>` : s;
}
const usd = v => `<span class="${v < 0 ? 'loss' : 'gain'}">${v > 0 ? '+' : ''}${v.toLocaleString('en-US')}</span>`;
const signed = (v, dp) => `<span class="${v < 0 ? 'loss' : 'gain'}">${v > 0 ? '+' : ''}${v.toFixed(dp)}</span>`;
const nil = '<span class="nil">—</span>';
const grainTags = ids => [...new Set(ids.map(id => byId(DATASETS, id).grain))].map(g => `<span class="grain">${g}</span>`).join('');
const paramChips = params => Object.entries(params).map(([k, v]) => `<span class="kv">${k}<b>${esc(v)}</b></span>`).join('');
function fmtK(v) {
  const a = Math.abs(v);
  const s = a >= 1e6 ? (a / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : a >= 1e3 ? (a / 1e3).toFixed(a % 1e3 ? 1 : 0).replace(/\.0$/, '') + 'k' : String(Math.round(a));
  return v > 0 ? '+' + s : v < 0 ? '−' + s : '0';
}
function niceStep(span) {
  const raw = span / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}

// 折线图：坐标轴文字用 HTML，曲线用拉伸的 SVG，悬停读数由全局 pointermove 处理
let CHARTS = {}, chartSeq = 0;
function chart(series, o) {
  const id = 'c' + (++chartSeq);
  const all = series.flatMap(s => s.data);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  if (hi === lo) hi = lo + 1;
  const step = niceStep(hi - lo);
  const i0 = Math.floor(lo / step), i1 = Math.ceil(hi / step);
  lo = i0 * step; hi = i1 * step;
  const ticks = []; for (let i = i0; i <= i1; i++) ticks.push(i * step);
  const Y = v => (hi - v) / (hi - lo) * 100;
  CHARTS[id] = { series, n: o.n, from: o.from, to: o.to };
  const grid = ticks.map(v => `<line class="${v === 0 ? 'zero' : 'grid'}" x1="0" x2="1000" y1="${Y(v).toFixed(2)}" y2="${Y(v).toFixed(2)}"/>`).join('');
  const paths = series.map(s => `<path style="stroke:${s.color}" d="${s.data.map((v, i) => `${i ? 'L' : 'M'}${(i / (o.n - 1) * 1000).toFixed(1)},${Y(v).toFixed(2)}`).join('')}"/>`).join('');
  const xl = o.from ? [o.from, isoDay((T(o.from) + T(o.to)) / 2), o.to] : ['开始', '中段', '结束'];
  return `<div class="chart" style="--h:${o.h}px">
    <div class="chart-y" aria-hidden="true">${ticks.map(v => `<span style="top:${Y(v).toFixed(2)}%">${fmtK(v)}</span>`).join('')}</div>
    <div class="chart-plot" data-chart="${id}">
      <svg viewBox="0 0 1000 100" preserveAspectRatio="none" role="img" aria-label="${esc(o.label || '累计盈亏曲线')}">${grid}${paths}</svg>
      <div class="chart-hover" hidden><i class="chart-line"></i><div class="chart-tip"></div></div>
    </div>
    <div class="chart-x" aria-hidden="true">${xl.map(t => `<span>${t}</span>`).join('')}</div>
  </div>`;
}

document.addEventListener('pointermove', e => {
  const plot = e.target.closest?.('.chart-plot');
  document.querySelectorAll('.chart-hover:not([hidden])').forEach(h => { if (!plot || !plot.contains(h)) h.hidden = true; });
  if (!plot) return;
  const c = CHARTS[plot.dataset.chart]; if (!c) return;
  const r = plot.getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const i = Math.round(f * (c.n - 1));
  const hov = plot.querySelector('.chart-hover'), tip = hov.querySelector('.chart-tip');
  const rows = c.series.filter(s => i < s.data.length);
  if (!rows.length) { hov.hidden = true; return; }
  hov.hidden = false;
  hov.style.setProperty('--x', (i / (c.n - 1) * 100) + '%');
  tip.classList.toggle('flip', f > 0.6);
  const when = c.from ? isoDay(T(c.from) + (T(c.to) - T(c.from)) * i / (c.n - 1)) : `回放 ${Math.round(i / (c.n - 1) * 100)}%`;
  tip.innerHTML = `<div class="when">${when}</div>` + rows.map(s => `<div><i class="sw" style="background:${s.color}"></i>${esc(s.name)}　${s.data[i] > 0 ? '+' : ''}${s.data[i].toLocaleString('en-US')}</div>`).join('');
});

function queueAhead(j) { return JOBS.filter(x => x.status === '排队中').reverse().indexOf(j); }

function track(j) {
  const { sel } = j, curve = j._r.curve, n = curve.length, p = j.progress / 100, k = SK[j.status];
  const at = shortDay(T(sel.start) + (T(sel.end) - T(sel.start)) * p, sel.start, sel.end);
  if (k === 'queue') {
    const ahead = queueAhead(j);
    return `<div class="track is-queue" aria-hidden="true"></div><div class="track-cap"><span class="dot queue"></span>排队中，${ahead ? `前面还有 ${ahead} 个` : '下一个开始'}</div>`;
  }
  const m = Math.max(2, Math.round(p * (n - 1)) + 1), shown = curve.slice(0, m);
  let lo = Math.min(0, ...shown), hi = Math.max(0, ...shown);
  if (hi === lo) hi = lo + 1;
  const W = 200, H = 38, y = v => (4 + (1 - (v - lo) / (hi - lo)) * (H - 8)).toFixed(1);
  const d = shown.map((v, i) => `${i ? 'L' : 'M'}${(i / (n - 1) * W).toFixed(1)},${y(v)}`).join('');
  const xc = (p * W).toFixed(1);
  const tone = k === 'done' ? (curve[n - 1] >= 0 ? 'ln-gain' : 'ln-loss') : k === 'fail' ? 'ln-dim' : 'ln-ink';
  const cap = k === 'run' ? `<span class="dot run" style="animation-delay:-${Date.now() % 1600}ms"></span>回放至 ${at}，剩余约 ${Math.max(1, Math.round(j.etaMin * (1 - p)))} 分钟`
    : k === 'fail' ? `<span class="dot fail"></span>失败，停在 ${at}`
    : `<span class="dot done"></span>已完成，回放 ${spanDays(sel.start, sel.end)} 天`;
  return `<div class="track" aria-hidden="true"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${k === 'done' ? '' : `<rect class="played" x="0" y="0" width="${xc}" height="${H}"/>`}
      <line class="zero" x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}"/>
      <path class="${tone}" d="${d}"/>
      ${k === 'run' ? `<line class="cursor" x1="${xc}" x2="${xc}" y1="0" y2="${H}"/>` : ''}
      ${k === 'fail' ? `<line class="stop" x1="${xc}" x2="${xc}" y1="0" y2="${H}"/>` : ''}
    </svg></div><div class="track-cap">${cap}</div>`;
}

function jobRow(j) {

  return `<tr class="job${open ? ' is-open' : ''}${isNew ? ' is-new' : ''}" data-act="row" data-id="${j.id}"${isNew ? ` style="--d:-${Date.now() - UI.flashAt}ms"` : ''}>

function drawer(j) {
  const r = j.result, k = SK[j.status], n = j._r.curve.length, st = byId(STRATEGIES, j.sel.strategy);
  const m = Math.max(2, Math.round(j.progress / 100 * (n - 1)) + 1);

    : `<p class="muted">回测完成后显示完整指标。当前已回放 ${Math.round(j.progress)}%。</p>`;
  const plot = k === 'queue' ? '<div class="chart-empty">等待开始</div>'
    : chart([{ name: j.id, color: '#18212E', data: j._r.curve.slice(0, m) }], { n, from: j.sel.start, to: j.sel.end, h: 168, label: `${j.id} 累计盈亏` });
  return `<div class="drawer">
    <section><h3>${r ? '结果' : '状态'}</h3>${left}</section>
    <section><h3>累计盈亏 (USD)</h3>${plot}</section>

      </div>
    </section>
  </div>`;
}

function bestIdx(key, vals) {
  const dir = /单腿成交风险/.test(key) ? -1 : /盈亏|夏普|成交率|捕获率|胜率|在线率|markout|手续费|回撤/.test(key) ? 1 : 0;
  if (!dir) return -1;
  const nums = vals.map(v => v === undefined ? NaN : parseFloat(v));
  const valid = nums.filter(Number.isFinite);
  if (valid.length < 2) return -1;
  return nums.indexOf(dir > 0 ? Math.max(...valid) : Math.min(...valid));
}

function vCompare() {
  const js = UI.compare.map(jobById).filter(j => j && j.result);
  if (js.length < 2) return `<div class="empty"><h2>还没有可以对比的结果</h2>
    <p>在任务队列里勾选至少 2 个已完成的任务。当前选了 ${js.length} 个。</p>
    <button class="btn btn-primary" data-act="tab" data-k="jobs" data-fk="empty-jobs">去任务队列</button></div>`;
  const color = i => SERIES[i % SERIES.length];
  const sameSpan = js.every(j => j.sel.start === js[0].sel.start && j.sel.end === js[0].sel.end);
  const n = js[0]._r.curve.length;
  const cols = js.length;
  const row = (label, vals, opts = {}) => {
    const diff = opts.diff && new Set(vals.map(v => String(v))).size > 1;
    const best = opts.best ? bestIdx(label, opts.raw) : -1;
    return `<tr class="${diff ? 'diff' : ''}"><td>${label}${diff ? '<span class="diff-tag">不同</span>' : ''}</td>${vals.map((v, i) => `<td class="num">${i === best ? `<span class="best-v">${v}</span>` : v}</td>`).join('')}</tr>`;
  };
  const pkeys = [...new Set(js.flatMap(j => Object.keys(j.sel.params)))];
  const mkeys = [...new Set(js.flatMap(j => Object.keys(j.result.m)))];
  const grp = t => `<tr class="grp"><th colspan="${cols + 1}">${t}</th></tr>`;
  return `<div class="pane">
      <div class="pane-head"><h2>累计盈亏 (USD)</h2>
        <div class="legend">${js.map((j, i) => `<span class="legend-item"><i class="sw" style="background:${color(i)}"></i><b>${j.id}</b>${esc(j.strategy)}
          <button class="x" data-act="uncmp" data-id="${j.id}" data-fk="uncmp-${j.id}" aria-label="把 ${j.id} 移出对比">×</button></span>`).join('')}</div></div>
      ${chart(js.map((j, i) => ({ name: j.id, color: color(i), data: j._r.curve })), sameSpan ? { n, from: js[0].sel.start, to: js[0].sel.end, h: 280 } : { n, h: 280 })}
      ${sameSpan ? '' : '<p class="note">这几次回测的时间段不同，横轴按回放进度对齐。</p>'}
    </div>
    <div class="table-wrap" style="margin-top:16px"><table class="cmp">
      <thead><tr><th>项目</th>${js.map((j, i) => `<th class="num"><i class="sw" style="background:${color(i)}"></i>${j.id}</th>`).join('')}</tr></thead>
      <tbody>
        ${grp('参数')}
        ${pkeys.map(k => row(k, js.map(j => j.sel.params[k] ?? '—'), { diff: true })).join('')}
        ${grp('运行环境')}
        ${row('策略', js.map(j => `${esc(j.strategy)} ${j.ver}`), { diff: true })}
        ${row('数据', js.map(j => grainTags(j.sel.datasets)), { diff: true })}
        ${row('模拟交易所', js.map(j => j.sel.venues.join('、')), { diff: true })}
        ${row('时间', js.map(j => `${j.sel.start} 至 ${j.sel.end}`), { diff: true })}
        ${grp('结果')}
        ${mkeys.map(k => { const raw = js.map(j => j.result.m[k]); return row(k, raw.map(v => v === undefined ? nil : fmtVal(v, k)), { best: true, raw }); }).join('')}
      </tbody></table></div>
    <p class="note">黄色行是这几次回测不一样的地方。结果里带下划线的是该项最好的一次；不同策略的专属指标不可比，显示为 —。</p>`;
}

function summary() {
  const s = UI.sel, st = byId(STRATEGIES, s.strategy), msgs = validate(s);
  const of = lvl => msgs.filter(m => m.lvl === lvl);
  const group = (lvl, title) => of(lvl).length ? `<div class="check ${lvl}"><h3>${title}</h3><ul>${of(lvl).map(m => `<li>${esc(m.text)}</li>`).join('')}</ul></div>` : '';
  const ok = !of('err').length;
  const free = WORKERS - countBy('运行中');
  const waits = free <= 0 || countBy('排队中') > 0;
  const days = s.start && s.end && s.start <= s.end ? spanDays(s.start, s.end) : null;
  return `<h2>提交前检查</h2>
    <dl class="kvlist wrap">
      <dt>策略</dt><dd>${esc(st.name)} ${st.version}</dd>
      <dt>数据</dt><dd>${s.datasets.length ? `${s.datasets.length} 份　${grainTags(s.datasets)}` : '未选'}</dd>
      <dt>模拟交易所</dt><dd>${s.venues.join('、') || '未选'}</dd>
      <dt>时间</dt><dd>${days ? `${s.start} 至 ${s.end}，<span style="white-space:nowrap">共 ${days} 天</span>` : '未填完整'}</dd>
    </dl>
    ${ok ? `<p class="check-ok">${CHECK}没有阻止提交的问题</p>` : ''}
    ${group('err', '无法提交')}${group('warn', '需要注意')}${group('info', '提示')}
    ${ok ? `<div class="eta"><span>预计用时</span><b>约 ${estimateMin(s)} 分钟</b><span>${waits ? 'worker 已满，提交后需要排队' : `现在有 ${free} 个空闲 worker，提交后马上开始`}</span></div>` : '<div class="eta"></div>'}
    <button class="btn btn-primary btn-block" data-act="submit" data-fk="submit" ${ok ? '' : 'disabled'}>提交回测</button>
    <button class="link-btn cfg-toggle" data-act="toggle-config" data-fk="toggle-config" aria-expanded="${UI.showConfig}">${UI.showConfig ? '收起' : '查看'}生成的 nautilus 配置</button>
    ${UI.showConfig ? `<pre class="code">${esc(JSON.stringify(buildConfig(s), null, 2))}</pre>` : ''}`;
}

function vNew() {
  const s = UI.sel, st = byId(STRATEGIES, s.strategy);
  const usable = [...st.needs, ...(st.alsoNeeds || [])];
  return `<div class="compose"><div>
    <section class="fs">
      <div class="fs-head"><h2>策略</h2><p>只列出已登记的版本</p></div>
      <div class="opts" role="radiogroup" aria-label="策略">${STRATEGIES.map(x => opt('radio', 'strategy', x.id, s.strategy === x.id,
        `${esc(x.name)} <span class="ver">${x.version}</span>`, `${esc(x.owner)}，需要${esc(x.needsText)}`)).join('')}</div>
      <div class="params-grid">${st.params.map(p => `<label class="field"><span class="field-label">${esc(p.label)}</span>
        <input type="number" step="any" data-act="param" data-key="${p.key}" data-fk="p-${p.key}" value="${esc(s.params[p.key])}">
        <span class="field-hint"><code>${p.key}</code>，默认 ${p.def}</span></label>`).join('')}</div>
    </section>
    <section class="fs">
      <div class="fs-head"><h2>数据</h2><p>${esc(st.name)}能用的数据排在前面</p></div>
      <div class="opts">${[...DATASETS].sort((a, b) => usable.includes(b.grain) - usable.includes(a.grain)).map(d => {
        const fit = usable.includes(d.grain);
        return opt('checkbox', 'ds', d.id, s.datasets.includes(d.id), esc(d.name), `${esc(d.source)}，${d.from} 至 ${d.to}，${d.size}`,
          `<span class="grain">${d.grain}</span>${fit ? '' : '<span class="opt-note">该策略用不上</span>'}`, !fit);
      }).join('')}</div>
      <div class="dates">
        <label class="field"><span class="field-label">开始日期</span><input type="date" data-act="start" data-fk="start" value="${s.start}"></label>
        <label class="field"><span class="field-label">结束日期</span><input type="date" data-act="end" data-fk="end" value="${s.end}"></label>
        <div class="cov-note" id="cov-note">${covNote()}</div>
      </div>
    </section>
    <section class="fs">
      <div class="fs-head"><h2>模拟交易所</h2><p>${st.minVenues > 1 ? `这个策略至少要 ${st.minVenues} 个` : '每个都是一套手续费、延迟和成交规则'}</p></div>
      <div class="opts">${VENUES.map(v => opt('checkbox', 'venue', v.id, s.venues.includes(v.id), esc(v.name),
        `订单簿 ${v.book}，Maker ${v.maker} / Taker ${v.taker}，延迟${esc(v.latency)}，成交${esc(v.fill)}`,
        `<span class="cal cal-${v.cal}">${CAL_TEXT[v.cal]}</span>`)).join('')}</div>
    </section>
  </div>
  <aside class="summary" id="summary" aria-label="提交前检查">${summary()}</aside></div>`;
}

// ---------------------------------------------------------------------------
// 渲染
// ---------------------------------------------------------------------------
const VIEWS = { new: vNew, jobs: vJobs, compare: vCompare, data: vData, strat: vStrat, venue: vVenue };

function capacity() {
  const run = countBy('运行中'), q = countBy('排队中');
  return `<div class="cap-cells" aria-hidden="true">${Array.from({ length: WORKERS }, (_, i) => `<i class="${i < run ? 'on' : ''}"></i>`).join('')}</div>
    <div><b>${run}</b> / ${WORKERS} 个 worker 在跑${q ? `，<b>${q}</b> 个排队` : ''}</div>`;
}
const navCount = k => k === 'jobs' ? countBy('运行中') + countBy('排队中') : k === 'compare' ? UI.compare.length : 0;

function shell() {
  const [title, sub] = TITLES[UI.tab];
  return `<div class="shell">
    <nav class="rail" aria-label="主导航">
      <div class="brand">${BRAND}<span>回测台</span></div>
      ${NAV.map(g => `<div class="nav-group">${g.map(([k, t]) => {
        const counted = k === 'jobs' || k === 'compare', n = navCount(k);
        return `<button class="nav-link" data-act="tab" data-k="${k}" data-fk="nav-${k}" ${UI.tab === k ? 'aria-current="page"' : ''}>${t}${counted ? `<span class="nav-count" id="nc-${k}" ${n ? '' : 'hidden'}>${n}</span>` : ''}</button>`;
      }).join('')}</div>`).join('')}
      <p class="rail-note">原型：假数据，不连接后端，刷新即清空。</p>
    </nav>
    <main class="main">
      <header class="top">
        <div class="top-title"><h1>${title}</h1><p>${sub}</p></div>
        <div class="cap" id="cap">${capacity()}</div>
        ${UI.tab === 'new' ? '' : '<button class="btn btn-primary" data-act="tab" data-k="new" data-fk="top-new">新建回测</button>'}
      </header>
      <div class="view">${VIEWS[UI.tab]()}</div>
    </main>
  </div>`;
}

function restoreFocus(fk) {
  if (fk) document.querySelector(`[data-fk="${CSS.escape(fk)}"]`)?.focus({ preventScroll: true });
}

function render() {
  const fk = document.activeElement?.dataset?.fk;
  CHARTS = {}; chartSeq = 0;
  document.getElementById('app').innerHTML = shell();
  renderTray();
  restoreFocus(fk);
}

function repaintSummary() {
  const el = document.getElementById('summary'); if (!el) return;
  const fk = document.activeElement?.dataset?.fk;
  el.innerHTML = summary();
  document.getElementById('cov-note').innerHTML = covNote();
  if (fk && el.querySelector(`[data-fk="${CSS.escape(fk)}"]`)) restoreFocus(fk);
}

function renderTray() {
  const el = document.getElementById('tray');
  const n = UI.compare.length, show = n > 0 && UI.tab !== 'compare';
  el.hidden = !show;
  if (!show) return;
  el.innerHTML = `<span>对比 ${n} 个</span>${UI.compare.map(id => `<span class="chip">${id}</span>`).join('')}
    ${n < 2 ? '<span class="hint">再选 1 个已完成的任务</span>' : ''}
    <button class="btn btn-s" data-act="tab" data-k="compare" data-fk="tray-go" ${n < 2 ? 'disabled' : ''}>对比结果</button>
    <button class="link-btn" data-act="clear-cmp" data-fk="tray-clear">清空</button>`;
}

// 每秒刷新：任务队列整页重绘（保留焦点，悬停图表或输入时跳过），其他页只更新占用表和计数
function tick() {
  const a = document.activeElement;
  const typing = a && a.tagName === 'INPUT' && !['checkbox', 'radio'].includes(a.type);
  if (UI.tab === 'jobs' && !typing && !document.querySelector('.chart-plot:hover')) return render();
  const cap = document.getElementById('cap'); if (cap) cap.innerHTML = capacity();
  ['jobs', 'compare'].forEach(k => { const el = document.getElementById('nc-' + k); if (el) { const n = navCount(k); el.textContent = n; el.hidden = !n; } });
}

function go(k) { UI.tab = k; render(); window.scrollTo(0, 0); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

const toggleCmp = id => { UI.compare = UI.compare.includes(id) ? UI.compare.filter(x => x !== id) : [...UI.compare, id]; };

// ---------------------------------------------------------------------------
// 交互
// ---------------------------------------------------------------------------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const { act, id } = t.dataset, s = UI.sel;
  if (act === 'tab') return go(t.dataset.k);
  if (act === 'filter') { UI.filter = t.dataset.f; return render(); }
  if (act === 'reset-filter') { UI.filter = 'all'; UI.mine = false; return render(); }
  if (act === 'open') { UI.open = UI.open === id ? null : id; return render(); }
  if (act === 'row') {
    if (e.target.closest('input, button, label, a') || String(getSelection())) return;
    UI.open = UI.open === id ? null : id; return render();
  }
  if (act === 'cmp-btn') { toggleCmp(id); return render(); }
  if (act === 'uncmp') { UI.compare = UI.compare.filter(x => x !== id); return render(); }
  if (act === 'clear-cmp') { UI.compare = []; return render(); }
  if (act === 'clone') { UI.sel = structuredClone(jobById(id).sel); go('new'); return toast(`已载入 ${id} 的配置，改完可以直接提交`); }
  if (act === 'use-strat') { s.strategy = id; s.params = defaults(id); return go('new'); }
  if (act === 'fill-cov') { const c = coverage(s.datasets); s.start = c.from; s.end = c.to; return render(); }
  if (act === 'toggle-config') { UI.showConfig = !UI.showConfig; return repaintSummary(); }
  if (act === 'submit') {
    if (!canSubmit(s)) return;
    const j = submitJob(s);
    Object.assign(UI, { filter: 'all', mine: false, open: null, flash: j.id, flashAt: Date.now() });
    setTimeout(() => { if (UI.flash === j.id) UI.flash = null; }, 2400);
    go('jobs');
    return toast(`已提交回测 ${j.id}`);
  }
});

document.addEventListener('change', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const { act, id } = t.dataset, s = UI.sel;
  if (act === 'cmp') { toggleCmp(id); return render(); }
  if (act === 'mine') { UI.mine = t.checked; return render(); }
  if (act === 'strategy') { s.strategy = id; s.params = defaults(id); return render(); }
  if (act === 'ds' || act === 'venue') {
    const key = act === 'ds' ? 'datasets' : 'venues';
    s[key] = t.checked ? [...s[key], id] : s[key].filter(x => x !== id);
    return render();
  }
  if (act === 'start' || act === 'end') { s[act] = t.value; return repaintSummary(); }
});

document.addEventListener('input', e => {
  const t = e.target.closest('[data-act="param"]'); if (!t) return;
  UI.sel.params[t.dataset.key] = t.value === '' ? '' : +t.value;
  repaintSummary();
});

render();
</script>
</body>
</html>
